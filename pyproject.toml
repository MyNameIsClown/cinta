[project]
name = "cinta"
version = "0.1.0"
description = "CLI tool to auto-generate pipeline configuration for gitlab and github"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer (>=0.27.2,<0.28.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
cinta = "cinta.cli:app"
